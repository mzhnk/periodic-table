<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>3D Periodic Table</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.2.0/css/all.min.css">
    <!-- Anime.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <style>
        :root {
            /* 3D Elements Constants */
            --w: 130px; --h: 170px;
            --c-0: 255, 60, 60;      /* Nonmetal */
            --c-1: 60, 255, 255;     /* Noble */
            --c-2: 255, 165, 0;      /* Alkali */
            --c-3: 255, 220, 0;      /* Alkaline */
            --c-4: 150, 255, 60;     /* Metalloid */
            --c-5: 0, 191, 255;      /* Halogen */
            --c-6: 255, 105, 180;    /* Post-trans */
            --c-7: 60, 200, 100;     /* Transition */
            --c-8: 144, 238, 144;    /* Lanthanide */
            --c-9: 221, 160, 221;    /* Actinide */
            
            --cam-x: 0px; --cam-y: 0px; --cam-z: -2600px;
            --rot-x: 0deg; --rot-y: 0deg;

            /* Dropdown UI Constants */
            --bg:          #07080D;
            --surface:     #0D0F17;
            --surface-2:   #131622;
            --surface-3:   #1A1E2E;
            --border:      rgba(255,255,255,0.055);
            --border-neon: rgba(0,224,255,0.18);
            --neon:        #00E0FF;
            --neon-dim:    rgba(0,224,255,0.08);
            --neon-glow:   rgba(0,224,255,0.35);
            --text:        #DDE3F0;
            --text-2:      #6E7890;
            --text-3:      #353B52;
            --panel-w:     260px;
            --r:           14px;
            --spring:      cubic-bezier(0.16, 1, 0.3, 1);
            --ease:        cubic-bezier(0.4, 0, 0.2, 1);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at center, #11141d 0%, #07080D 100%);
            color: var(--text);
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden; 
            height: 100vh;
            height: 100dvh; 
            width: 100vw;
            perspective: 1200px; cursor: grab;
            -webkit-touch-callout: none;
            touch-action: none;
        }
        body:active { cursor: grabbing; }

        /* --- HAMBURGER BUTTON --- */
        .hamburger {
            position: fixed; top: max(20px, env(safe-area-inset-top)); left: max(20px, env(safe-area-inset-left));
            width: 44px; height: 44px; border-radius: 12px;
            border: 1px solid var(--border);
            background: rgba(13,15,23,0.8);
            backdrop-filter: blur(10px);
            cursor: pointer; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 5px;
            transition: background .2s, border-color .25s, box-shadow .25s;
            z-index: 160;
        }
        .hamburger:hover { border-color: var(--border-neon); background: var(--neon-dim); box-shadow: 0 0 14px var(--neon-dim); }
        .hamburger.active {
            border-color: rgba(0,224,255,0.4); background: rgba(0,224,255,0.07);
            box-shadow: 0 0 0 3px rgba(0,224,255,0.10), 0 0 20px rgba(0,224,255,0.12);
        }
        .bar { display: block; width: 18px; height: 2px; border-radius: 2px; background: var(--text-2); transition: background .25s; }
        .hamburger:hover .bar, .hamburger.active .bar { background: var(--neon); }

        /* --- DROPDOWN PANEL --- */
        .dropdown-wrapper {
            position: fixed; top: calc(max(20px, env(safe-area-inset-top)) + 55px); left: max(10px, env(safe-area-inset-left)); width: var(--panel-w);
            z-index: 150; overflow: hidden; max-height: 0;
            transition: max-height .56s var(--spring);
            font-family: 'Outfit', sans-serif;
        }
        .dropdown-wrapper.open { max-height: 600px; }

        .dropdown-panel {
            margin: 0 10px 15px;
            background: rgba(13,15,23,0.85); backdrop-filter: blur(28px) saturate(160%);
            border: 1px solid var(--border); border-radius: var(--r); padding: 10px;
            position: relative;
            box-shadow: 0 0 0 1px rgba(0,224,255,0.05), 0 32px 64px rgba(0,0,0,0.72), 0 0 40px rgba(0,224,255,0.04);
            transform: translateY(-14px) scale(0.97); opacity: 0; transform-origin: top left;
            transition: transform .46s var(--spring) .04s, opacity .28s var(--ease) .04s;
            will-change: transform, opacity;
        }
        .dropdown-wrapper.open .dropdown-panel { transform: translateY(0) scale(1); opacity: 1; }

        .dropdown-panel::before {
            content: ''; position: absolute; top:-1px; left:16px; right:16px; height:1px;
            background: linear-gradient(90deg, transparent, var(--neon), transparent);
            opacity: 0; transition: opacity .4s var(--ease) .22s;
        }
        .dropdown-wrapper.open .dropdown-panel::before { opacity: 0.6; }

        .close-row {
            display: flex; align-items: center; justify-content: flex-end;
            padding-bottom: 6px; opacity: 0; transform: translateX(-8px);
            transition: opacity .28s var(--ease) .08s, transform .34s var(--spring) .08s;
        }
        .dropdown-wrapper.open .close-row { opacity: 1; transform: translateX(0); }
        .close-btn {
            width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--surface-2); color: var(--text-3); font-size: 12px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: 0.2s;
        }
        .close-btn:hover { background: rgba(255,75,75,0.15); border-color: rgba(255,75,75,0.3); color: #FF6B6B; box-shadow: 0 0 12px rgba(255,75,75,0.2); }

        .divider {
            height: 1px; margin: 8px 4px; background: linear-gradient(90deg, var(--border-neon), var(--border), transparent);
            opacity: 0; transition: opacity .3s var(--ease);
        }
        .dropdown-wrapper.open .d1 { opacity: 1; transition-delay: .12s; }
        .dropdown-wrapper.open .d2 { opacity: 1; transition-delay: .28s; }
        
        .section-label {
            padding: 4px 8px; font-family: 'JetBrains Mono', monospace; font-size: 9.5px;
            letter-spacing: .16em; text-transform: uppercase; color: var(--text-3);
            display: flex; align-items: center; gap: 6px; opacity: 0; transform: translateX(-6px);
            transition: opacity .28s var(--ease), transform .32s var(--spring);
        }
        .section-label::after { content:''; flex:1; height:1px; background: var(--border); }
        .dropdown-wrapper.open .sl1 { opacity:1; transform:translateX(0); transition-delay:.13s; }
        .dropdown-wrapper.open .sl2 { opacity:1; transform:translateX(0); transition-delay:.29s; }

        /* Layout Items */
        .layout-items { display: flex; flex-direction: column; gap: 3px; }
        .layout-item {
            display: flex; align-items: center; gap: 12px; padding: 10px 12px;
            border-radius: 9px; cursor: pointer; position: relative; overflow: hidden;
            color: var(--text-2); font-size: 14px; font-weight: 500; letter-spacing: .02em;
            border: 1px solid transparent; opacity: 0; transform: translateX(-10px);
            transition: color .2s, background .2s, border-color .2s, box-shadow .2s, opacity .32s, transform .38s var(--spring);
        }
        .layout-item::after {
            content:''; position:absolute; inset:0;
            background: linear-gradient(90deg, transparent 0%, rgba(0,224,255,0.05) 50%, transparent 100%);
            transform: translateX(-100%); transition: transform .5s var(--ease);
        }
        .layout-item:hover::after { transform: translateX(100%); }
        .layout-item:hover { color: var(--text); background: var(--neon-dim); border-color: rgba(0,224,255,0.10); }
        .layout-item.selected {
            color: var(--neon); background: rgba(0,224,255,0.07); border-color: rgba(0,224,255,0.18);
            box-shadow: 0 0 18px rgba(0,224,255,0.06), inset 0 0 14px rgba(0,224,255,0.03);
        }
        .layout-item.selected::before {
            content:''; position:absolute; left:-1px; top:20%; bottom:20%; width:2px; border-radius:2px;
            background: var(--neon); box-shadow: 0 0 8px var(--neon-glow), 0 0 16px var(--neon-dim);
        }
        .item-icon { width: 20px; font-size: 14px; display: flex; justify-content: center; color: var(--text-3); transition: .2s; }
        .layout-item:hover .item-icon { color: var(--text-2); }
        .layout-item.selected .item-icon { color: var(--neon); filter: drop-shadow(0 0 5px var(--neon-glow)); }
        .item-name { flex: 1; transition: 0.3s; }
        .item-check {
            font-size: 11px; color: var(--neon); opacity: 0; transform: scale(0.4) rotate(-10deg);
            transition: opacity .22s var(--ease), transform .28s var(--spring); filter: drop-shadow(0 0 4px var(--neon-glow));
        }
        .layout-item.selected .item-check { opacity: 1; transform: scale(1) rotate(0deg); }

        .dropdown-wrapper.open .layout-item:nth-child(1) { opacity:1; transform:translateX(0); transition-delay:.15s; }
        .dropdown-wrapper.open .layout-item:nth-child(2) { opacity:1; transform:translateX(0); transition-delay:.18s; }
        .dropdown-wrapper.open .layout-item:nth-child(3) { opacity:1; transform:translateX(0); transition-delay:.21s; }
        .dropdown-wrapper.open .layout-item:nth-child(4) { opacity:1; transform:translateX(0); transition-delay:.24s; }

        /* Language Toggle Pill */
        .lang-section { padding: 8px 4px 4px; opacity:0; transform:translateX(-6px); transition: opacity .3s var(--ease) .31s, transform .36s var(--spring) .31s; }
        .dropdown-wrapper.open .lang-section { opacity: 1; transform: translateX(0); }
        
        .lang-toggle {
            position: relative; display: flex; background: var(--surface-2);
            border: 1px solid var(--border); border-radius: 9px; padding: 4px;
        }
        .lang-toggle::before {
            content: ''; position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px);
            border-radius: 6px; background: var(--surface-3); border: 1px solid var(--border-neon);
            box-shadow: 0 0 10px rgba(0,224,255,0.08), inset 0 1px 0 rgba(255,255,255,0.04);
            transition: left .32s var(--spring); pointer-events: none;
        }
        .lang-toggle.id-active::before { left: 50%; }

        .lang-btn {
            flex: 1; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500;
            letter-spacing: .1em; padding: 8px 0; text-align: center; cursor: pointer;
            border: none; background: none; color: var(--text-3); position: relative; z-index: 1;
            transition: color .25s var(--ease);
        }
        .lang-btn.active { color: var(--neon); text-shadow: 0 0 10px var(--neon-glow); }

        /* --- BACKDROP --- */
        .backdrop {
            position: fixed; inset: 0; z-index: 130; pointer-events: none;
            transition: background .3s var(--ease), backdrop-filter .3s;
        }
        .backdrop.active { pointer-events: auto; background: rgba(0,0,0,0.4); backdrop-filter: blur(2px); }
        
        .helper-text {
            position: fixed; 
            bottom: max(25px, calc(25px + env(safe-area-inset-bottom)));
            left: 50%; transform: translateX(-50%);
            width: max-content; max-width: 90vw; 
            color: rgba(255,255,255,0.6); font-size: 12px; font-family: 'Outfit', sans-serif;
            background: rgba(13,15,23,0.75); padding: 8px 20px; border-radius: 20px;
            pointer-events: none; border: 1px solid var(--border); text-align: center;
            backdrop-filter: blur(8px); z-index: 10; 
            display: flex; flex-direction: column;
            line-height: 1.5; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            transition: opacity 0.3s;
        }
        .helper-text .main-hlp { display: flex; align-items: center; justify-content: center; gap: 6px; }
        .helper-text span { color: var(--neon); font-weight: 600; text-shadow: 0 0 8px var(--neon-glow); }

        /* --- 3D CORE & ELEMENTS --- */
        #scene { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform-style: preserve-3d; }
        #scene-camera { position: absolute; top: 50%; left: 50%; transform-style: preserve-3d; transform: translate3d(var(--cam-x), var(--cam-y), var(--cam-z)); will-change: transform; }
        #scene-rotator { position: absolute; top: 0; left: 0; transform-style: preserve-3d; transform: rotateX(var(--rot-x)) rotateY(var(--rot-y)); will-change: transform; }
        #scene-content { position: absolute; transform-style: preserve-3d; }

        .element {
            position: absolute; width: var(--w); height: var(--h);
            left: calc(-1 * var(--w) / 2); top: calc(-1 * var(--h) / 2);
            background: rgba(var(--color-rgb), 0.08); border: 1px solid rgba(var(--color-rgb), 0.4);
            border-radius: 6px; display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; transition: background 0.3s, border-color 0.3s;
            cursor: pointer; box-shadow: 0 0 15px rgba(0,0,0,0.8); pointer-events: auto;
            will-change: transform;
        }
        .element:hover {
            background: rgba(var(--color-rgb), 0.3); border-color: rgba(var(--color-rgb), 1);
            box-shadow: 0 0 30px rgba(var(--color-rgb), 0.6), inset 0 0 15px rgba(var(--color-rgb), 0.3); z-index: 10;
        }
        .element.pressing { background: rgba(var(--color-rgb), 0.6); box-shadow: 0 0 35px rgba(var(--color-rgb), 1); }
        .element-number { position: absolute; top: 6px; right: 8px; font-size: 13px; color: rgba(var(--color-rgb), 0.8); }
        .element-symbol { font-size: 56px; font-weight: bold; color: rgba(var(--color-rgb), 1); line-height: 1; margin-bottom: 5px; text-shadow: 0 0 12px rgba(var(--color-rgb), 0.5); pointer-events: none;}
        .element-title { font-size: 12.5px; color: rgba(var(--color-rgb), 0.9); pointer-events: none; text-transform: uppercase; font-family: 'Outfit', sans-serif;}

        /* --- METADATA MODAL --- */
        #modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(12px);
            z-index: 2000; display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        #modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-card {
            width: 340px; max-width: 90vw; padding: 25px; background: rgba(var(--modal-color), 0.08); font-family: 'Outfit', sans-serif;
            border: 1px solid rgba(var(--modal-color), 0.8); border-radius: 12px;
            box-shadow: 0 0 50px rgba(var(--modal-color), 0.3), inset 0 0 20px rgba(var(--modal-color), 0.1);
            color: rgba(var(--modal-color), 1); transform: translateY(30px) scale(0.9); transition: transform 0.3s var(--spring);
            position: relative;
        }
        #modal-overlay.active .modal-card { transform: translateY(0) scale(1); }
        .modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .modal-symbol { font-size: 70px; font-family: 'Share Tech Mono'; font-weight: bold; line-height: 1; text-shadow: 0 0 15px rgba(var(--modal-color), 0.6);}
        .modal-number { font-size: 28px; font-family: 'JetBrains Mono'; opacity: 0.8;}
        .modal-name { font-size: 26px; font-weight: 600; margin-bottom: 20px; border-bottom: 1px solid rgba(var(--modal-color), 0.4); padding-bottom: 10px; text-transform: uppercase; letter-spacing: 1px;}
        .modal-stat { font-size: 15px; margin-bottom: 10px; opacity: 0.9; display: flex; justify-content: space-between;}
        
        .modal-close-btn {
            position: absolute; top: -15px; right: -15px; width: 36px; height: 36px; border-radius: 50%;
            background: #111; border: 2px solid rgba(var(--modal-color), 1); color: white; display: flex; justify-content: center; align-items: center;
            cursor: pointer; font-size: 14px; transition: 0.2s; box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .modal-close-btn:hover { background: rgba(var(--modal-color), 1); color: black; transform: scale(1.1); }
    </style>
</head>

            el.addEventListener('pointerdown', (e) => {

            if (!isRotating && !isPanning) return;
            const dX = e.clientX - prevX, dY = e.clientY - prevY;
            if (isRotating) { rotY += dX * 0.3; rotX -= dY * 0.3; rotX = Math.max(-90, Math.min(90, rotX)); }
            else if (isPanning) { camX += dX * 2.5; camY += dY * 2.5; }
            cameraNeedsUpdate = true; prevX = e.clientX; prevY = e.clientY;
        });
        document.addEventListener('mouseup', () => { isRotating = false; isPanning = false; });
        document.addEventListener('wheel', e => { camZ = Math.max(-6000, Math.min(-500, camZ - e.deltaY * 2)); cameraNeedsUpdate = true; });

        function getPinch(touches) { return Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY); }
        document.addEventListener('touchstart', e => {
            if (e.target.closest('#modal-overlay') || e.target.closest('#dropdownWrapper') || e.target.closest('#hamburgerBtn')) return;
            if (e.touches.length === 1) { isRotating = true; isPanning = false; prevX = e.touches[0].clientX; prevY = e.touches[0].clientY; }
            else if (e.touches.length === 2) { isRotating = false; isPanning = true; prevPinch = getPinch(e.touches); prevX = (e.touches[0].clientX + e.touches[1].clientX) / 2; prevY = (e.touches[0].clientY + e.touches[1].clientY) / 2; }
        }, { passive: false });
        
        document.addEventListener('touchmove', e => {
            if (e.target.closest('#modal-overlay') || e.target.closest('#dropdownWrapper') || e.target.closest('#hamburgerBtn')) return;
            e.preventDefault();
            if (isRotating && e.touches.length === 1) {
                const dX = e.touches[0].clientX - prevX, dY = e.touches[0].clientY - prevY;
                rotY += dX * 0.4; rotX = Math.max(-90, Math.min(90, rotX - dY * 0.4)); prevX = e.touches[0].clientX; prevY = e.touches[0].clientY;
            } else if (isPanning && e.touches.length === 2) {
                const curPinch = getPinch(e.touches); camZ = Math.max(-6000, Math.min(-500, camZ + (curPinch - prevPinch) * 5)); prevPinch = curPinch;
                const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2, midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                camX += (midX - prevX) * 2.5; camY += (midY - prevY) * 2.5; prevX = midX; prevY = midY;
            }
            cameraNeedsUpdate = true;
        }, { passive: false });
        document.addEventListener('touchend', () => { isRotating = false; isPanning = false; });
        
        const userSysLang = navigator.language || navigator.userLanguage;
        const defaultLang = userSysLang.toLowerCase().includes('id') ? 'ID' : 'EN';
        
        setLang(defaultLang);
        transformTo('table');
    </script>
</body>
